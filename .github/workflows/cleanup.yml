name: cleanup-artifacts
# Удаляет старые артефакты, чтобы не упереться в квоту хранилища
on:
  workflow_dispatch:
  push:
    paths: ["train/cleanup.txt"]
permissions:
  actions: write
  contents: read
jobs:
  clean:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Остановить устаревшие запуски (список в train/cancel.txt)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(cat train/cancel.txt 2>/dev/null); do gh run cancel $id --repo ${{ github.repository }} && echo "cancelled $id" || true; done
      - name: Удалить все артефакты репозитория
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for page in 1 2 3 4 5; do
            ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
            [ -z "$ids" ] && break
            for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null && echo "deleted $id"; done
          done
          gh api "repos/${{ github.repository }}/actions/artifacts" --jq '.total_count'
