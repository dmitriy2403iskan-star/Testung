name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.local/share/godot/export_templates/4.2.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.2.2.stable "$HOME/.local/share/godot/export_templates/"
          fi

          command -v java
          command -v javac
          command -v keytool
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          test -x "$JAVA_HOME/bin/java"
          echo "Using JAVA_HOME=$JAVA_HOME"

          keytool -genkeypair -keyalg RSA -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"
          touch "$SETTINGS"
          {
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"'
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/force_system_user = false'
            echo 'export/android/shutdown_adb_on_exit = true'
          } >> "$SETTINGS"

      - name: Validate Godot project
        run: godot --headless --editor --path . --quit

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/komandir.apk
          test -s build/komandir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: komandir-apk
          path: build/komandir.apk
