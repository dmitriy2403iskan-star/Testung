name: Fixed
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.2.2
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          test -d "$ANDROID_SDK_ROOT/build-tools/33.0.2"
          test -d "$ANDROID_SDK_ROOT/platforms/android-33"
      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.local/share/godot/export_templates/4.2.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.2.2.stable "$HOME/.local/share/godot/export_templates/"
          fi
          command -v java
          command -v javac
          command -v keytool
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          keytool -genkeypair -keyalg RSA -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
      - name: Validate project
        run: godot --headless --editor --path . --quit
      - name: Import resources
        run: godot --headless --path . --import
      - name: Build Fixed APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/Fixed.apk
          test -s build/Fixed.apk
          file build/Fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fixed
          path: build/Fixed.apk
          if-no-files-found: error
          retention-days: 14
