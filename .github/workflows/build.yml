name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  llm:
    # Собираем нейронку (godot-llm / llama.cpp) под Android arm64 по рецепту из CI самого аддона
    runs-on: ubuntu-22.04
    steps:
      - name: Кэш собранной нейронки
        id: lc
        uses: actions/cache/restore@v4
        with:
          key: llm-lib-fixed-1
          path: |
            llm/build/libgodot_llm.android.release.aarch64.so
            llm/build/libomp.so
      - uses: nttld/setup-ndk@v1
        if: steps.lc.outputs.cache-hit != 'true'
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Clone godot-llm
        if: steps.lc.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Adriankhl/godot-llm llm
          cd llm
          git checkout fb12d7d9c0ff6274bb6c5267e86004482befc842
          git submodule update --init --recursive
      - name: Dependencies
        if: steps.lc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build
      - name: Build Android library
        if: steps.lc.outputs.cache-hit != 'true'
        working-directory: llm
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir build
          cd build
          cmake .. --preset android-cpu-release
          ninja -j $(nproc)
      - name: Inspect library
        if: steps.lc.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          T=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          L=llm/build/libgodot_llm.android.release.aarch64.so
          ls -la llm/build/*.so
          echo "--- NEEDED ---"; $T/bin/llvm-readelf -d $L | grep -i "NEEDED\|SONAME" || true
          echo "--- entry symbol ---"; $T/bin/llvm-nm -D --defined-only $L | grep -i "llm_library_init" || echo "NO llm_library_init!"
          OMP=$(find $ANDROID_NDK_HOME -name libomp.so -path "*aarch64*" | head -1)
          echo "libomp: $OMP"
          cp "$OMP" llm/build/libomp.so
          ls -la llm/build/libomp.so
      - name: Сохранить в кэш
        if: steps.lc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: llm-lib-fixed-1
          path: |
            llm/build/libgodot_llm.android.release.aarch64.so
            llm/build/libomp.so

  apk:
    needs: llm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4
      - name: zstd для кэша
        run: (apt-get update -qq && apt-get install -y -qq zstd) >/dev/null 2>&1 || true; which zstd
      - name: Add godot-llm addon (из кэша)
        uses: actions/cache/restore@v4
        with:
          key: llm-lib-fixed-1
          path: |
            llm/build/libgodot_llm.android.release.aarch64.so
            llm/build/libomp.so
          fail-on-cache-miss: true
      - name: Положить библиотеки в аддон
        run: |
          mkdir -p addons/godot_llm/bin
          cp llm/build/libgodot_llm.android.release.aarch64.so llm/build/libomp.so addons/godot_llm/bin/
      - name: Write gdextension
        run: |
          if [ -f addons/godot_llm/bin/libgodot_llm.android.release.aarch64.so ]; then
            cat > addons/godot_llm/godot_llm.gdextension <<'EOF'
          [configuration]
          entry_symbol = "llm_library_init"
          compatibility_minimum = "4.2"

          [libraries]
          android.debug.arm64 = "bin/libgodot_llm.android.release.aarch64.so"
          android.release.arm64 = "bin/libgodot_llm.android.release.aarch64.so"

          [dependencies]
          android.debug.arm64 = {"res://addons/godot_llm/bin/libomp.so": ""}
          android.release.arm64 = {"res://addons/godot_llm/bin/libomp.so": ""}
          EOF
            echo "Addon OK:"; find addons -type f
          else
            echo "::warning::библиотека нейронки не собралась — APK без нейронки (солдаты на правилах)"
          fi
      - name: Setup Godot + Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/ || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          godot --headless --quiet --editor --quit || true
          S=~/.config/godot/editor_settings-4.tres
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > $S
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> $S
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> $S
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $S
          echo 'export/android/debug_keystore_pass = "android"' >> $S
          echo 'export/android/force_system_user = false' >> $S
          J="$JAVA_HOME"
          if [ -z "$J" ] || [ ! -x "$J/bin/javac" ]; then
            J=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          fi
          if [ ! -x "$J/bin/javac" ]; then
            J=$(ls -d /usr/lib/jvm/*/ 2>/dev/null | while read d; do [ -x "$d/bin/javac" ] && echo "${d%/}" && break; done)
          fi
          echo "Java SDK path: $J"
          [ -x "$J/bin/javac" ] || { echo "::error::Java JDK не найден"; exit 1; }
          echo "export/android/java_sdk_path = \"$J\"" >> $S
          echo 'export/android/shutdown_adb_on_exit = true' >> $S
      - name: Export APK
        run: |
          mkdir -p build
          echo "--- diagnostics ---"
          ls /usr/lib/android-sdk /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms 2>&1 || true
          ls ~/.local/share/godot/export_templates/ ~/.local/share/godot/export_templates/* 2>&1 | head -20 || true
          grep "export/android" ~/.config/godot/editor_settings-4.tres || true
          ls -la /root/debug.keystore || true
          echo "------------------"
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/komandir.apk
          echo "--- libs inside APK ---"
          unzip -l build/komandir.apk | grep -i "\.so\|lib/" || true
          ls -la build/
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: komandir-apk
          retention-days: 3
          path: build/komandir.apk
      - name: APK в Releases (не зависит от квоты артефактов)
        run: |
          [ -f build/komandir.apk ] || { echo "нет apk"; exit 1; }
          API=https://api.github.com/repos/${{ github.repository }}
          H="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          old=$(curl -sS -H "$H" $API/releases/tags/latest-apk | sed -n 's/^  "id": *\([0-9]*\),.*/\1/p' | head -1)
          [ -n "$old" ] && curl -sS -X DELETE -H "$H" $API/releases/$old
          curl -sS -X DELETE -H "$H" $API/git/refs/tags/latest-apk
          rid=$(curl -sS -X POST -H "$H" $API/releases -d "{\"tag_name\":\"latest-apk\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"APK (последняя сборка)\",\"prerelease\":true,\"body\":\"Сборка $GITHUB_SHA\"}" | sed -n 's/^  "id": *\([0-9]*\),.*/\1/p' | head -1)
          echo "release id: $rid"
          curl -sS -X POST -H "$H" -H "Content-Type: application/vnd.android.package-archive" --data-binary @build/komandir.apk "https://uploads.github.com/repos/${{ github.repository }}/releases/$rid/assets?name=komandir.apk" | head -c 300
