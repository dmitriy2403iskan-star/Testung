name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  llm:
    # Собираем нейронку (godot-llm / llama.cpp) под Android arm64 по рецепту из CI самого аддона
    runs-on: ubuntu-22.04
    steps:
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Clone godot-llm
        run: |
          git clone https://github.com/Adriankhl/godot-llm llm
          cd llm
          git checkout fb12d7d9c0ff6274bb6c5267e86004482befc842
          git submodule update --init --recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build
      - name: Build Android library
        working-directory: llm
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir build
          cd build
          cmake .. --preset android-cpu-release
          ninja -j $(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: android-llm-lib
          path: llm/build/libgodot_llm.android.release.aarch64.so
          if-no-files-found: error

  apk:
    needs: llm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4
      - name: Add godot-llm addon
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-llm-lib
          path: addons/godot_llm/bin
      - name: Write gdextension
        run: |
          if [ -f addons/godot_llm/bin/libgodot_llm.android.release.aarch64.so ]; then
            cat > addons/godot_llm/godot_llm.gdextension <<'EOF'
          [configuration]
          entry_symbol = "llm_library_init"
          compatibility_minimum = "4.2"

          [libraries]
          android.debug.arm64 = "bin/libgodot_llm.android.release.aarch64.so"
          android.release.arm64 = "bin/libgodot_llm.android.release.aarch64.so"
          EOF
            echo "Addon OK:"; find addons -type f
          else
            echo "::warning::библиотека нейронки не собралась — APK без нейронки (солдаты на правилах)"
          fi
      - name: Setup Godot + Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/ || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          godot --headless --quiet --editor --quit || true
          S=~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> $S
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> $S
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> $S
          echo 'export/android/debug_keystore_pass = "android"' >> $S
          echo 'export/android/force_system_user = false' >> $S
          J="$JAVA_HOME"
          if [ -z "$J" ] || [ ! -x "$J/bin/javac" ]; then
            J=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          fi
          if [ ! -x "$J/bin/javac" ]; then
            J=$(ls -d /usr/lib/jvm/*/ 2>/dev/null | while read d; do [ -x "$d/bin/javac" ] && echo "${d%/}" && break; done)
          fi
          echo "Java SDK path: $J"
          [ -x "$J/bin/javac" ] || { echo "::error::Java JDK не найден"; exit 1; }
          echo "export/android/java_sdk_path = \"$J\"" >> $S
          echo 'export/android/shutdown_adb_on_exit = true' >> $S
      - name: Export APK
        run: |
          mkdir -p build
          echo "--- diagnostics ---"
          ls /usr/lib/android-sdk /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms 2>&1 || true
          ls ~/.local/share/godot/export_templates/ ~/.local/share/godot/export_templates/* 2>&1 | head -20 || true
          grep "export/android" ~/.config/godot/editor_settings-4.tres || true
          ls -la /root/debug.keystore || true
          echo "------------------"
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/komandir.apk
      - uses: actions/upload-artifact@v4
        with:
          name: komandir-apk
          path: build/komandir.apk
