name: Build Auto Trainer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'auto-trainer-android/**'
      - '.github/workflows/build-auto-trainer-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-trainer-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-trainer-debug
          path: auto-trainer-android/app/build/outputs/apk/debug/app-debug.apk
