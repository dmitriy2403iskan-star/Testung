name: save-logs
# Сохраняет историю обучения и изменений проекта в logs/ (на телефоне: Run workflow)
on:
  workflow_dispatch:
  push:
    paths: ["train/logs.txt"]
permissions:
  contents: write
jobs:
  logs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать
        run: |
          git fetch origin train-status:refs/remotes/origin/train-status
          python3 ci/mklogs.py
          git config user.name trainer-bot; git config user.email bot@users.noreply.github.com
          git add logs && git commit -m "Логи обучения (авто)" && git push origin HEAD:main || echo "без изменений"
